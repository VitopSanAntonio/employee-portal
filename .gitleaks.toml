# Gitleaks configuration — extends the default ruleset.
#
# The Power Automate trigger URLs are no longer in the working tree: form
# submissions and status lookups go through the Cloudflare Worker proxy, which
# holds the flow URLs server-side.
#
# What remains is history. The commits below are the ones that carried the four
# leaked trigger signatures, and they are allowlisted by SHA so CI stays green
# on unrelated changes. Allowlisting by commit rather than by pattern is what
# lets a *new* Power Automate URL still fail the scan.
#
# ROTATION STILL REQUIRED: these URLs were served publicly from GitHub Pages
# and remain readable in this repository's history. Removing them from HEAD
# does not revoke them — the four flow trigger URLs must be regenerated in
# Power Automate, and only the new ones given to the Worker.
[extend]
useDefault = true

# Gitleaks' default ruleset does NOT recognise a Power Automate / Logic Apps
# trigger URL, so without this rule the one secret type this repository has
# actually leaked would pass CI unnoticed — which matters most right after
# rotation, when a fresh URL is the easiest thing to paste somewhere by
# mistake. Verified both ways: a sample URL is undetected without this rule
# and reported with it.
[[rules]]
id = "power-automate-trigger-url"
description = "Power Automate / Logic Apps trigger URL with a live sig= token"
regex = '''(?i)https://[^\s"'<>]*(?:logic\.azure\.com|powerplatform\.com)[^\s"'<>]*[?&]sig=[A-Za-z0-9_\-%]{16,}'''
tags = ["power-automate", "webhook", "flow-url"]

[allowlist]
description = "Historical commits containing the pre-proxy Power Automate trigger URLs (pending rotation)."
# Re-derived by scanning the full history with the rule above rather than by
# hand. Two corrections to the previous list:
#
#   * b6832d73 was missing. It carries a flow URL in safety-concern.html and is
#     reachable from main, so the leak footprint was one commit larger than
#     this file claimed.
#   * Seven entries were listed that contain no detectable secret at all. They
#     have been dropped: an allowlisted commit is permanently excused from
#     every future rule too, so listing commits "just in case" quietly widens
#     the blind spot instead of narrowing it.
#
# Keep this list derived, not appended to. It should contain exactly the
# commits that leak, and it should shrink to nothing once history is rewritten.
commits = [
  "37044f6a327295acdeba23b68f01e494d11eb064",
  "4702f3d30d14af448be16293641cdc2787cc5bf9",
  "678478b98f646959e59078c91a6e4af62b5f95fa",
  "7ac6bb5341a5cf4100431fa65ca9dac62f9da508",
  "b6832d73970f69525c817e6ce7f92f45497bd540",
  "fd2884359e832c3eae019ff832efc398cb51260d"
]
